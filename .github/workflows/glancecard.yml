name: glancecard

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gfazioli/glancecard@v0.6.0
        with:
          profile: Sundramrai3691
          repos: |
            Sundramrai3691/ForkSpace
            Sundramrai3691/RecallLoop
            Sundramrai3691/ReXcan
            Sundramrai3691/PeopleOps-Copilot
          time-zone: Asia/Kolkata
          theme: both
